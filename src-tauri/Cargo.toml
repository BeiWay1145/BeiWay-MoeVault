[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = ["tray-icon", "devtools"] }
tauri-plugin-log = "2"
tauri-plugin-opener = "2"

# Windows 原生拖放：wry 0.55.1 在 WebView2 上注册 OLE IDropTarget 的条件过于苛刻
# （SetAllowExternalDrop(false) 后子窗口往往没有既有 drop target，导致注册被跳过，
#  系统层面无接受拖放的目标 → 拖入时显示 STOP 拒绝光标）。
# 这里在壳层自行注册一个 IDropTarget，确保拖放始终可用。
[target.'cfg(windows)'.dependencies]
windows-core = "0.61"
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_System_Ole",
  "Win32_System_SystemServices",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Graphics_Gdi",
] }
